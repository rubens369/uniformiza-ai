<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Uniformiza AI - Teste Worker</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-white min-h-screen p-4">
<div class="max-w-5xl mx-auto">

<h1 class="text-3xl font-bold mb-2">Uniformiza AI</h1>
<p class="text-slate-300 mb-6">Teste via Cloudflare Worker + Hugging Face</p>

<div class="grid md:grid-cols-2 gap-4">
  <div class="bg-slate-900 p-4 rounded-2xl">
    <h2 class="font-bold mb-3">Foto da Pessoa</h2>
    <input id="pessoa" type="file" accept="image/*" class="mb-3">
    <img id="previewPessoa" class="w-full rounded-xl bg-slate-800">
  </div>

  <div class="bg-slate-900 p-4 rounded-2xl">
    <h2 class="font-bold mb-3">Foto da Camisa</h2>
    <input id="camisa" type="file" accept="image/*" class="mb-3">
    <img id="previewCamisa" class="w-full rounded-xl bg-slate-800">
  </div>
</div>

<button onclick="gerar()" class="mt-6 w-full bg-blue-600 hover:bg-blue-700 rounded-xl py-4 font-bold text-lg">
GERAR UNIFORMIZAÇÃO
</button>

<div class="bg-slate-900 p-4 rounded-2xl mt-6">
  <h2 class="font-bold mb-3">Status</h2>
  <pre id="status" class="text-sm whitespace-pre-wrap text-yellow-300">Aguardando imagens...</pre>
</div>

<div class="bg-slate-900 p-4 rounded-2xl mt-6">
  <h2 class="font-bold mb-3">Resultado</h2>
  <img id="resultado" class="w-full rounded-xl bg-slate-800">
</div>

</div>

<script>
const WORKER_URL = "https://uniformiza-ai-kolors.prmoizinho.workers.dev";

const pessoaInput = document.getElementById("pessoa");
const camisaInput = document.getElementById("camisa");
const previewPessoa = document.getElementById("previewPessoa");
const previewCamisa = document.getElementById("previewCamisa");
const resultado = document.getElementById("resultado");
const statusBox = document.getElementById("status");

function status(msg) {
  statusBox.textContent = msg;
}

function preview(input, img) {
  input.addEventListener("change", () => {
    const file = input.files[0];
    if (!file) return;
    img.src = URL.createObjectURL(file);
  });
}

preview(pessoaInput, previewPessoa);
preview(camisaInput, previewCamisa);

async function gerar() {
  const pessoa = pessoaInput.files[0];
  const camisa = camisaInput.files[0];

  if (!pessoa || !camisa) {
    alert("Envie a foto da pessoa e a foto da camisa.");
    return;
  }

  resultado.removeAttribute("src");
  status("Enviando imagens para o servidor seguro...\nAguarde, pode demorar alguns minutos.");

  const form = new FormData();
  form.append("pessoa", pessoa);
  form.append("camisa", camisa);

  try {
    const res = await fetch(`${SPACE_URL}/upload`, {
      method: "POST",
      body: form
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.erro || data.error || "Erro desconhecido.");
    }

    resultado.src = data.imageUrl || data.result || data.image;
    status("Imagem gerada com sucesso!");

  } catch (e) {
    console.error(e);
    status("Erro ao gerar imagem:\n\n" + e.message);
  }
}
</script>
</body>
</html>
