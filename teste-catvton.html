<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste CatVTON - Debug</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen p-4">
<div class="max-w-4xl mx-auto">
  <h1 class="text-3xl font-bold">Uniformiza AI</h1>
  <p class="text-slate-300 mb-4">Teste CatVTON com diagnóstico</p>

  <div class="bg-slate-900 p-4 rounded-2xl mb-4">
    <button onclick="testarApi()" class="w-full bg-emerald-600 py-3 rounded-xl font-bold">
      1. TESTAR API DO SPACE
    </button>
  </div>

  <div class="grid md:grid-cols-2 gap-4">
    <div class="bg-slate-900 p-4 rounded-2xl">
      <h2 class="font-bold mb-3">Foto da Pessoa</h2>
      <input id="person" type="file" accept="image/*" class="mb-3">
      <img id="personPreview" class="w-full rounded-xl bg-slate-800">
    </div>

    <div class="bg-slate-900 p-4 rounded-2xl">
      <h2 class="font-bold mb-3">Foto da Camisa</h2>
      <input id="cloth" type="file" accept="image/*" class="mb-3">
      <img id="clothPreview" class="w-full rounded-xl bg-slate-800">
    </div>
  </div>

  <button onclick="gerar()" class="mt-6 w-full bg-blue-600 hover:bg-blue-700 rounded-xl py-4 font-bold">
    2. GERAR COM CATVTON
  </button>

  <div class="bg-slate-900 p-4 rounded-2xl mt-6">
    <h2 class="font-bold mb-3">Status</h2>
    <pre id="log" class="text-xs whitespace-pre-wrap text-yellow-300"></pre>
  </div>

  <div class="bg-slate-900 p-4 rounded-2xl mt-6">
    <h2 class="font-bold mb-3">Resultado</h2>
    <img id="resultado" class="w-full rounded-xl bg-slate-800">
  </div>
</div>

<script type="module">
import { Client } from "https://cdn.jsdelivr.net/npm/@gradio/client/+esm";

const SPACE = "zhengchong/CatVTON";

const personInput = document.getElementById("person");
const clothInput = document.getElementById("cloth");
const personPreview = document.getElementById("personPreview");
const clothPreview = document.getElementById("clothPreview");
const resultado = document.getElementById("resultado");
const logBox = document.getElementById("log");

function log(msg) {
  logBox.textContent += "\\n" + msg;
}

function limparLog() {
  logBox.textContent = "";
}

function preview(input, img) {
  input.addEventListener("change", () => {
    const file = input.files[0];
    if (!file) return;
    img.src = URL.createObjectURL(file);
  });
}

preview(personInput, personPreview);
preview(clothInput, clothPreview);

async function withTimeout(promise, ms, message) {
  let timer;
  const timeout = new Promise((_, reject) => {
    timer = setTimeout(() => reject(new Error(message)), ms);
  });
  return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
}

window.testarApi = async function () {
  limparLog();
  log("Conectando ao Space: " + SPACE);

  try {
    const app = await withTimeout(
      Client.connect(SPACE),
      60000,
      "Tempo esgotado ao conectar ao Space."
    );

    log("Conectado.");
    log("Tentando obter informações da API...");

    console.log(app);
    log("Objeto app foi enviado para o console do navegador.");

    if (app.view_api) {
      const info = await app.view_api();
      console.log("API INFO:", info);
      log(JSON.stringify(info, null, 2));
    } else {
      log("Este client não expôs view_api(). Vamos testar endpoint padrão.");
    }
  } catch (e) {
    console.error(e);
    log("ERRO: " + e.message);
  }
};

window.gerar = async function () {
  limparLog();

  const pessoa = personInput.files[0];
  const camisa = clothInput.files[0];

  if (!pessoa || !camisa) {
    alert("Envie a foto da pessoa e a foto da camisa.");
    return;
  }

  resultado.removeAttribute("src");

  try {
    log("Conectando ao Space...");
    const app = await withTimeout(
      Client.connect(SPACE),
      60000,
      "Tempo esgotado ao conectar ao Space."
    );

    log("Conectado. Enviando imagens...");
    log("Se demorar muito, o Space pode estar em fila ou dormindo.");

    const result = await withTimeout(
      app.predict("/tryon", [
        pessoa,
        camisa,
        null,
        "upper",
        30,
        2.5,
        -1
      ]),
      300000,
      "Tempo esgotado. A geração passou de 5 minutos."
    );

    console.log("RESULTADO:", result);
    log("Resposta recebida:");
    log(JSON.stringify(result, null, 2).slice(0, 2000));

    const output = result.data?.[0];

    if (output?.url) {
      resultado.src = output.url;
      log("Imagem carregada com sucesso.");
    } else if (typeof output === "string") {
      resultado.src = output;
      log("Imagem carregada com sucesso.");
    } else {
      log("Não encontrei URL da imagem em data[0]. Veja o console.");
    }

  } catch (e) {
    console.error(e);
    log("ERRO: " + e.message);
  }
};
</script>
</body>
</html>
